init:
  desc: Create volok.json with a fresh admin token
  color: green
  native: true
  args:
    - "public-url|p:str"

serve:
  desc: Run the HTTP server in foreground
  color: green
  native: true

token:
  desc: Admin token commands
  color: yellow
  show:
    desc: Show the admin token
    native: true
  rotate:
    desc: Rotate the admin token
    native: true
    args:
      - "yes|y:bool?"

user:
  desc: Reader subscription tokens
  color: green
  add:
    desc: Generate a new reader token
    native: true
  list:
    desc: List reader tokens
    native: true
    args:
      - "show-tokens:bool?"
  remove:
    desc: Remove a reader token
    native: true
    args:
      - "token:str?"
      - "token-stdin:bool?"
      - "yes|y:bool?"

node:
  desc: Node library commands
  color: cyan
  list:
    desc: List nodes
    native: true
  show:
    desc: Show one node with its link
    native: true
    args:
      - "id:str"
  add:
    desc: Add an existing direct link
    native: true
    args:
      - "name|n:str"
      - "url|u:str"
      - "url-stdin:bool?"
  rename:
    desc: Rename a node
    native: true
    args:
      - "id:str"
      - "name:str"
  enable:
    desc: Enable a node in the subscription
    native: true
    args:
      - "id:str"
  disable:
    desc: Disable a node in the subscription
    native: true
    args:
      - "id:str"
  remove:
    desc: Remove a node from the library
    native: true
    args:
      - "id:str"
      - "yes|y:bool?"

proxy:
  desc: Router relay proxy commands
  color: magenta
  init:
    desc: Generate REALITY identity for the router proxy
    native: true
    args:
      - "port|p:int?"
      - "sni|s:str?"
  show:
    desc: Show proxy identity and status
    native: true
  config:
    desc: Print sing-box config for the router proxy
    native: true
  remove:
    desc: Remove the proxy identity
    native: true
    args:
      - "yes|y:bool?"
