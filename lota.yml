vars:
- BINARY=volok
- GO_LDFLAGS=-s -w

build:
  desc: Build for different platforms
  host:
    desc: Build for the host platform
    script: |
      CGO_ENABLED=0 go build -trimpath -ldflags="$GO_LDFLAGS" -o "$BINARY" ./cmd/volok

  x64:
    desc: Build for Linux x64
    script: |
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$GO_LDFLAGS" -o "${BINARY}-linux-amd64" ./cmd/volok

  arm64:
    desc: Build for Linux ARM64
    script: |
      CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$GO_LDFLAGS" -o "${BINARY}-linux-arm64" ./cmd/volok

  arm:
    desc: Build for Linux ARM (armv7)
    script: |
      CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="$GO_LDFLAGS" -o "${BINARY}-linux-armv7" ./cmd/volok

run:
  desc: Run the server in the foreground
  script: |
    ./volok serve

lint:
  backend:
    desc: Run golangci-lint on the backend
    script: |
      golangci-lint run ./...

test:
  desc: Run Go tests
  script: |
    go test ./...

push:
  desc: Push to GitHub
  color: cyan
  args:
  - "tag:str?"
  script: |
    if [ -n "$tag" ]; then
      git tag -f "$tag"
      git push origin main
      git push origin "$tag" --force
    else
      git push origin main
    fi
