name: Release

on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:


permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Go tests
      run: go test ./...
    - name: Go vet
      run: go vet ./...
    - name: Install shellcheck
      run: sudo apt-get update -y && sudo apt-get install -y shellcheck
    - name: Installer syntax check
      run: bash -n internal/installer/node.sh && shellcheck internal/installer/node.sh

  binaries:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GOPROXY: https://proxy.golang.org,direct
      GO_LDFLAGS: -s -w
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Get short SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
    - name: Build binaries
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="$GO_LDFLAGS -X volok/internal/cli.version=${{ steps.vars.outputs.sha_short }}" \
          -o volok-linux-amd64 ./cmd/volok
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -trimpath -ldflags="$GO_LDFLAGS -X volok/internal/cli.version=${{ steps.vars.outputs.sha_short }}" \
          -o volok-linux-arm64 ./cmd/volok
        CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
          go build -trimpath -ldflags="$GO_LDFLAGS -X volok/internal/cli.version=${{ steps.vars.outputs.sha_short }}" \
          -o volok-linux-armv7 ./cmd/volok
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: volok-linux-*

  ipk:
    runs-on: ubuntu-latest
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GOPROXY: https://proxy.golang.org,direct
      SDK_URL: https://downloads.openwrt.org/releases/23.05.4/targets/mediatek/mt7622/openwrt-sdk-23.05.4-mediatek-mt7622_gcc-12.3.0_musl.Linux-x86_64.tar.xz
      SDK_DIR: ${{ github.workspace }}/openwrt-sdk
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binaries
    - name: Cache OpenWrt SDK
      id: sdk-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.SDK_DIR }}
        key: openwrt-sdk-mt7622-23.05.4
    - name: Download and extract SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$SDK_DIR"
        wget -q -O /tmp/openwrt-sdk.tar.xz "$SDK_URL" || curl -L -o /tmp/openwrt-sdk.tar.xz "$SDK_URL"
        tar xf /tmp/openwrt-sdk.tar.xz -C "$SDK_DIR" --strip-components=1
    - name: Prepare package
      run: |
        mkdir -p "$SDK_DIR/package/volok"
        cp volok-linux-arm64 "$SDK_DIR/package/volok/volok"
        cp -r deploy/openwrt/files "$SDK_DIR/package/volok/"
        cp deploy/openwrt/Makefile "$SDK_DIR/package/volok/"
        # Keep the packaged init script identical to the embedded asset.
        cp internal/cli/assets/volok.init "$SDK_DIR/package/volok/files/volok.init"
    - name: Patch Makefile version
      run: |
        VER="${GITHUB_REF_NAME#v}"
        sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VER/" "$SDK_DIR/package/volok/Makefile"
    - name: Build IPK
      run: |
        cd "$SDK_DIR"
        make defconfig
        make package/volok/compile -j$(nproc)
    - name: Collect IPK
      run: |
        IPK_PATH=$(find "$SDK_DIR/bin/packages" -name "volok_*.ipk" | head -n1)
        if [ -z "$IPK_PATH" ]; then
          echo "ERROR: .ipk not found after build"
          exit 1
        fi
        cp "$IPK_PATH" ./volok.ipk
    - name: Upload IPK
      uses: actions/upload-artifact@v4
      with:
        name: ipk
        path: ./volok.ipk

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [ binaries, ipk, docker ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: binaries
    - name: Download IPK
      uses: actions/download-artifact@v4
      with:
        name: ipk
        path: ipk
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          binaries/volok-linux-amd64
          binaries/volok-linux-arm64
          binaries/volok-linux-armv7
          ipk/*.ipk
